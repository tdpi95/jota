<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    html, body { margin: 0; padding: 0; }
  </style>
</helmet>
<div style="width:512px;height:512px;background:oklch(58% 0.15 45);display:flex;align-items:center;justify-content:center;">
  <svg viewBox="0 0 100 100" width="86%" height="86%">
    <defs>
      <filter id="tile-shadow" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="1.6" stdDeviation="1.8" flood-color="oklch(24% 0.02 75)" flood-opacity="0.22"/>
      </filter>
    </defs>
    <rect x="40" y="16" width="46" height="46" rx="11" fill="oklch(97.3% 0.012 75)" filter="url(#tile-shadow)"/>
    <rect x="20" y="46" width="34" height="34" rx="9" fill="oklch(93% 0.03 45)" filter="url(#tile-shadow)"/>
    <rect x="12" y="72" width="20" height="20" rx="6" fill="oklch(93% 0.05 85)" filter="url(#tile-shadow)"/>
  </svg>
</div>
</x-dc>
</body>
</html>
